# Community Cloud puts an app to sleep after a stretch without visitors and shows a
# "Zzzz" page that scares off anyone arriving from a forum link. Every two hours this
# opens both public deployments in a real browser, presses the wake button if needed,
# and waits until the app has rendered. See tools/keep_demo_awake.py.
#
# GitHub drops or delays scheduled runs when it is busy, so the schedule is tighter
# than the sleep window on purpose. "Run workflow" on the Actions tab runs it now.
name: Keep the public demo awake

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-demo-awake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the deployments
        run: python tools/keep_demo_awake.py
      - name: Keep what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-${{ github.run_number }}
          path: keepalive-artifacts/
          if-no-files-found: ignore
          retention-days: 7
